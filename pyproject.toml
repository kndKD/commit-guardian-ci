[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commit-guardian-ci"
version = "0.1.0"
description = "Flask app with Docker + GitHub Actions CI and an AI Commit Guardian"
requires-python = ">=3.12"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F"]

[tool.coverage.run]
source = ["app", "guardian"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
